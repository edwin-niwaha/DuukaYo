components:
  schemas:
    AccountRegistrationInput:
      type: object
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9@.+_-]{3,150}$
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
          minLength: 10
        confirm_password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - confirm_password
      - email
      - password
      - username
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 60
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 250
      required:
      - address
      - id
      - label
      - name
      - phone
    Allocation:
      type: object
      properties:
        method:
          type: string
          maxLength: 20
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        tendered:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        change:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        reference:
          type: string
          maxLength: 100
        provider_verified:
          type: boolean
      required:
      - amount
      - method
      - tendered
    BranchInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
      required:
      - name
    BranchOutput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        id:
          type: integer
      required:
      - id
      - name
    BranchSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    Business:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        logo:
          type: string
          format: uri
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        website:
          type: string
          format: uri
          maxLength: 200
        published:
          type: boolean
        currency:
          type: string
          readOnly: true
        timezone:
          type: string
          maxLength: 60
        contact:
          type: string
          maxLength: 80
        delivery_enabled:
          type: boolean
        delivery_fee:
          type: integer
          maximum: 100000000000
          minimum: 0
          format: int64
        safety_buffer:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        storefront_branch:
          type: integer
          nullable: true
        branches:
          type: array
          items:
            $ref: '#/components/schemas/BranchSummary'
          readOnly: true
      required:
      - branches
      - currency
      - id
      - name
      - slug
    CartInput:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartItemInput'
      required:
      - lines
    CartItemInput:
      type: object
      properties:
        product:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 10000
          minimum: 1
      required:
      - product
      - quantity
    CashRegisterInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
      required:
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
      required:
      - id
      - name
    CheckoutInput:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
        quote:
          type: integer
          minimum: 1
      required:
      - client_id
      - quote
    CreateBusinessInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 30
      required:
      - id
      - name
      - phone
    DeviceInput:
      type: object
      properties:
        token:
          type: string
          maxLength: 512
        pending_sales:
          type: integer
          maximum: 100000
          minimum: 0
      required:
      - pending_sales
      - token
    FeaturedFeed:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/FeaturedProduct'
      required:
      - products
    FeaturedProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        image:
          type: string
          format: uri
        shop:
          type: string
        shop_id:
          type: integer
        slug:
          type: string
        price:
          type: integer
        currency:
          type: string
        available:
          type: integer
        destination:
          type: string
        preview:
          type: boolean
      required:
      - available
      - currency
      - destination
      - id
      - image
      - name
      - preview
      - price
      - shop
      - shop_id
      - slug
    GoogleInput:
      type: object
      properties:
        id_token:
          type: string
          writeOnly: true
          maxLength: 10000
      required:
      - id_token
    ImageUploadInput:
      type: object
      properties:
        image:
          type: string
          format: uri
      required:
      - image
    ImageUploadOutput:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
      - url
    KindEnum:
      enum:
      - opening
      - receipt
      - adjustment
      type: string
      description: |-
        * `opening` - opening
        * `receipt` - receipt
        * `adjustment` - adjustment
    LineInput:
      type: object
      properties:
        product:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 10000
          minimum: 1
        price:
          type: integer
          maximum: 100000000000
          minimum: 0
          format: int64
        discount:
          type: integer
          maximum: 100000000000
          minimum: 0
          format: int64
          default: 0
        cost:
          type: integer
          maximum: 100000000000
          minimum: 0
          format: int64
      required:
      - product
      - quantity
    LoginInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - password
      - username
    MergeInput:
      type: object
      properties:
        source:
          type: integer
          minimum: 1
        token:
          type: string
          writeOnly: true
          maxLength: 100
      required:
      - source
      - token
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 30
        delivery:
          type: boolean
        address:
          type: string
          maxLength: 250
        delivery_fee:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        currency:
          type: string
          maxLength: 3
        total:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        lines: {}
        status:
          type: string
          maxLength: 15
        payment_state:
          type: string
          maxLength: 20
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
        sale:
          type: integer
          nullable: true
      required:
      - created_at
      - currency
      - expires_at
      - id
      - lines
      - name
      - phone
      - total
    OrderConfirmation:
      type: object
      properties:
        id:
          type: integer
        token:
          type: string
      required:
      - id
      - token
    OrderInput:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/LineInput'
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 30
        delivery:
          type: boolean
          default: false
        address:
          type: string
          maxLength: 250
      required:
      - client_id
      - lines
      - name
      - phone
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
